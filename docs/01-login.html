<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Melodle – Login (Wireframe)</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { text-decoration: none; color: inherit; }
  input::placeholder { color: #AAAAAA; }
</style>
</head>
<body>

<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #333333;">

  <div style="width: 380px; display: flex; flex-direction: column; gap: 28px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="width: 56px; height: 56px; border: 1px solid #999999; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700;">M</div>
      <div style="font-size: 22px; font-weight: 700;">Melodle</div>
      <div style="font-size: 13px; color: #888888; text-align: center;">Login-Formular</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 12px; color: #666666;">E-Mail</label>
        <input type="email" placeholder="Text" style="height: 42px; border: 1px solid #999999; padding: 0 12px; font-size: 14px; box-sizing: border-box;" />
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 12px; color: #666666;">Passwort</label>
        <input type="password" placeholder="Text" style="height: 42px; border: 1px solid #999999; padding: 0 12px; font-size: 14px; box-sizing: border-box;" />
      </div>
      <a href="02-gruppen.html">
        <button style="width: 100%; height: 42px; border: 1px solid #333333; background: #333333; color: #FFFFFF; font-size: 14px; cursor: pointer;">Einloggen</button>
      </a>
      <div style="text-align: center; font-size: 12px; color: #888888;">Kein Konto? <span style="text-decoration: underline;">Registrieren</span></div>
    </div>

  </div>

</div>

</body>
</html>
