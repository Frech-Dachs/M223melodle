<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Melodle – Gruppenübersicht (Wireframe)</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { text-decoration: none; color: inherit; }
</style>
</head>
<body>

<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #FFFFFF; display: flex; color: #333333; overflow: hidden;">

  <div style="width: 220px; flex-shrink: 0; border-right: 1px solid #CCCCCC; display: flex; flex-direction: column; box-sizing: border-box;">
    <div style="height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid #CCCCCC; box-sizing: border-box;">
      <div style="width: 26px; height: 26px; border: 1px solid #999999; flex-shrink: 0;"></div>
      <div style="font-size: 16px; font-weight: 700;">Melodle</div>
    </div>
    <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box;">
      <div style="padding: 8px 10px; font-size: 14px; font-weight: 700; border-left: 3px solid #333333;">Gruppen</div>
      <a href="05-bestenliste.html"><div style="padding: 8px 10px; font-size: 14px; color: #666666;">Bestenliste</div></a>
      <a href="04-runde.html"><div style="padding: 8px 10px; font-size: 14px; color: #666666;">Runde spielen</div></a>
      <div style="padding: 8px 10px; font-size: 14px; color: #666666;">Profil</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
    <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; border-bottom: 1px solid #CCCCCC; box-sizing: border-box;">
      <div style="font-size: 18px; font-weight: 700;">Meine Gruppen</div>
      <button style="height: 36px; padding: 0 16px; border: 1px solid #333333; background: #FFFFFF; font-size: 13px; cursor: pointer;">+ Gruppe erstellen</button>
    </div>

    <div style="flex-grow: 1; padding: 24px 36px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-content: start;">

      <a href="03-songliste.html">
        <div style="border: 1px solid #999999; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="font-size: 16px; font-weight: 700;">Freitagsrunde</div>
            <div style="font-size: 10px; border: 1px solid #999999; padding: 3px 8px;">HOST</div>
          </div>
          <div style="font-size: 12px; color: #888888;">8 Mitglieder · 12 Songs · zuletzt gestern</div>
          <div style="font-size: 12px; color: #333333;">Dein Rang: #2 · 340 Punkte</div>
        </div>
      </a>

      <a href="05-bestenliste.html">
        <div style="border: 1px solid #999999; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 16px; font-weight: 700;">WG-Musikquiz</div>
          <div style="font-size: 12px; color: #888888;">4 Mitglieder · 27 Songs · zuletzt vor 3 Tagen</div>
          <div style="font-size: 12px; color: #333333;">Dein Rang: #1 · 512 Punkte</div>
        </div>
      </a>

      <div style="border: 1px dashed #999999; padding: 20px; display: flex; align-items: center; justify-content: center; color: #888888; font-size: 13px; min-height: 90px; box-sizing: border-box;">
        + Gruppe per Code beitreten
      </div>

    </div>
  </div>

</div>

</body>
</html>
