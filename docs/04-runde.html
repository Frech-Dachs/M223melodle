<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Melodle – Rate-Runde (Wireframe)</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { text-decoration: none; color: inherit; }
  input::placeholder { color: #AAAAAA; }
</style>
</head>
<body>

<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #FFFFFF; display: flex; color: #333333; overflow: hidden;">

  <div style="width: 220px; flex-shrink: 0; border-right: 1px solid #CCCCCC; display: flex; flex-direction: column; box-sizing: border-box;">
    <div style="height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid #CCCCCC; box-sizing: border-box;">
      <div style="width: 26px; height: 26px; border: 1px solid #999999; flex-shrink: 0;"></div>
      <div style="font-size: 16px; font-weight: 700;">Melodle</div>
    </div>
    <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box;">
      <a href="02-gruppen.html"><div style="padding: 8px 10px; font-size: 14px; color: #666666;">Gruppen</div></a>
      <a href="05-bestenliste.html"><div style="padding: 8px 10px; font-size: 14px; color: #666666;">Bestenliste</div></a>
      <div style="padding: 8px 10px; font-size: 14px; font-weight: 700; border-left: 3px solid #333333;">Runde spielen</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
    <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; border-bottom: 1px solid #CCCCCC; box-sizing: border-box;">
      <div style="display: flex; flex-direction: column;">
        <div style="font-size: 11px; color: #888888;">Freitagsrunde</div>
        <div style="font-size: 17px; font-weight: 700;">Song 3 von 10</div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="font-size: 12px; color: #888888;">Punkte: 340</div>
        <div style="font-size: 13px; border: 1px solid #999999; padding: 6px 14px;">0:07</div>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; overflow: hidden;">

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 40px; box-sizing: border-box;">

        <div style="width: 160px; height: 160px; border: 1px solid #999999; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #CCCCCC;">?</div>

        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="font-size: 11px; padding: 5px 10px; border: 1px solid #CCCCCC; color: #999999;">0.1s</div>
          <div style="font-size: 11px; padding: 5px 10px; border: 1px solid #333333; font-weight: 700;">0.5s</div>
          <div style="font-size: 11px; padding: 5px 10px; border: 1px solid #CCCCCC; color: #999999;">1s</div>
          <div style="font-size: 11px; padding: 5px 10px; border: 1px solid #CCCCCC; color: #999999;">2s</div>
          <div style="font-size: 11px; padding: 5px 10px; border: 1px solid #CCCCCC; color: #999999;">4s</div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div style="width: 70px; height: 70px; border-radius: 50%; border: 1px solid #333333; display: flex; align-items: center; justify-content: center; font-size: 13px;">Play</div>
          <div style="font-size: 12px; color: #888888;">Ausschnitt abspielen (0.5s)</div>
        </div>

        <div style="display: flex; gap: 10px; width: 100%; max-width: 420px;">
          <input type="text" placeholder="Songtitel eingeben…" style="flex-grow: 1; height: 44px; border: 1px solid #999999; padding: 0 12px; font-size: 14px; box-sizing: border-box;" />
          <button style="width: 90px; height: 44px; border: 1px solid #333333; background: #333333; color: #FFFFFF; font-size: 14px; cursor: pointer;">Raten</button>
        </div>
      </div>

      <div style="width: 280px; flex-shrink: 0; border-left: 1px solid #CCCCCC; padding: 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 11px; color: #888888;">Live-Status · 8 Mitspieler</div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 26px; height: 26px; border-radius: 50%; border: 1px solid #999999;"></div>
          <div style="flex-grow: 1; font-size: 13px;">Nina</div>
          <div style="font-size: 12px;">✓</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 26px; height: 26px; border-radius: 50%; border: 1px solid #999999;"></div>
          <div style="flex-grow: 1; font-size: 13px;">Timo</div>
          <div style="font-size: 12px;">✓</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 26px; height: 26px; border-radius: 50%; border: 1px solid #333333;"></div>
          <div style="flex-grow: 1; font-size: 13px; font-weight: 700;">Du</div>
          <div style="font-size: 12px; color: #999999;">…</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; color: #AAAAAA;">
          <div style="width: 26px; height: 26px; border-radius: 50%; border: 1px solid #CCCCCC;"></div>
          <div style="flex-grow: 1; font-size: 13px;">Sara</div>
          <div style="font-size: 12px;">–</div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; color: #AAAAAA;">
          <div style="width: 26px; height: 26px; border-radius: 50%; border: 1px solid #CCCCCC;"></div>
          <div style="flex-grow: 1; font-size: 13px;">Jonas</div>
          <div style="font-size: 12px;">–</div>
        </div>

        <div style="margin-top: auto; font-size: 11px; color: #999999;">Runde endet automatisch, sobald alle geraten haben oder die Zeit abläuft.</div>
      </div>

    </div>
  </div>

</div>

</body>
</html>
