<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Melodle – Songliste (Wireframe)</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { text-decoration: none; color: inherit; }
  input::placeholder { color: #AAAAAA; }
</style>
</head>
<body>

<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #FFFFFF; display: flex; color: #333333; overflow: hidden;">

  <div style="width: 220px; flex-shrink: 0; border-right: 1px solid #CCCCCC; display: flex; flex-direction: column; box-sizing: border-box;">
    <div style="height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 1px solid #CCCCCC; box-sizing: border-box;">
      <div style="width: 26px; height: 26px; border: 1px solid #999999; flex-shrink: 0;"></div>
      <div style="font-size: 16px; font-weight: 700;">Melodle</div>
    </div>
    <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px; box-sizing: border-box;">
      <a href="02-gruppen.html"><div style="padding: 8px 10px; font-size: 14px; color: #666666;">Gruppen</div></a>
      <a href="05-bestenliste.html"><div style="padding: 8px 10px; font-size: 14px; color: #666666;">Bestenliste</div></a>
      <div style="padding: 8px 10px; font-size: 14px; color: #666666;">Profil</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;">
    <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; border-bottom: 1px solid #CCCCCC; box-sizing: border-box;">
      <div style="display: flex; flex-direction: column;">
        <div style="font-size: 11px; color: #888888;">Gruppen / Freitagsrunde</div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="font-size: 17px; font-weight: 700;">Songliste</div>
          <div style="font-size: 10px; border: 1px solid #999999; padding: 2px 8px;">HOST</div>
        </div>
      </div>
      <a href="04-runde.html"><button style="height: 38px; padding: 0 18px; border: 1px solid #333333; background: #333333; color: #FFFFFF; font-size: 13px; cursor: pointer;">Runde starten</button></a>
    </div>

    <div style="padding: 16px 36px 0; flex-shrink: 0; box-sizing: border-box;">
      <input type="text" placeholder="Suche…" style="height: 38px; width: 320px; border: 1px solid #999999; padding: 0 12px; font-size: 13px; box-sizing: border-box;" />
    </div>

    <div style="flex-grow: 1; padding: 16px 36px 36px; box-sizing: border-box;">
      <div style="border: 1px solid #999999;">

        <div style="display: grid; grid-template-columns: 40px 3fr 2fr 2fr 40px; gap: 14px; padding: 10px 16px; border-bottom: 1px solid #CCCCCC; font-size: 11px; color: #888888;">
          <div></div><div>Titel</div><div>Interpret</div><div>Von</div><div></div>
        </div>

        <div style="display: grid; grid-template-columns: 40px 3fr 2fr 2fr 40px; gap: 14px; padding: 10px 16px; align-items: center; border-bottom: 1px solid #EEEEEE;">
          <div style="width: 28px; height: 28px; border: 1px solid #CCCCCC;"></div>
          <div style="font-size: 13px;">Sweet Dreams</div>
          <div style="font-size: 13px; color: #666666;">Eurythmics</div>
          <div style="font-size: 13px; color: #666666;">Leon</div>
          <div style="font-size: 13px; color: #999999;">×</div>
        </div>

        <div style="display: grid; grid-template-columns: 40px 3fr 2fr 2fr 40px; gap: 14px; padding: 10px 16px; align-items: center; border-bottom: 1px solid #EEEEEE;">
          <div style="width: 28px; height: 28px; border: 1px solid #CCCCCC;"></div>
          <div style="font-size: 13px;">Blinding Lights</div>
          <div style="font-size: 13px; color: #666666;">The Weeknd</div>
          <div style="font-size: 13px; color: #666666;">Nina</div>
          <div style="font-size: 13px; color: #999999;">×</div>
        </div>

        <div style="display: grid; grid-template-columns: 40px 3fr 2fr 2fr 40px; gap: 14px; padding: 10px 16px; align-items: center; border-bottom: 1px solid #EEEEEE;">
          <div style="width: 28px; height: 28px; border: 1px solid #CCCCCC;"></div>
          <div style="font-size: 13px;">Take On Me</div>
          <div style="font-size: 13px; color: #666666;">a-ha</div>
          <div style="font-size: 13px; color: #666666;">Timo</div>
          <div style="font-size: 13px; color: #999999;">×</div>
        </div>

        <div style="display: grid; grid-template-columns: 40px 3fr 2fr 2fr 40px; gap: 14px; padding: 10px 16px; align-items: center;">
          <div style="width: 28px; height: 28px; border: 1px solid #CCCCCC;"></div>
          <div style="font-size: 13px;">Africa</div>
          <div style="font-size: 13px; color: #666666;">Toto</div>
          <div style="font-size: 13px; color: #666666;">Sara</div>
          <div style="font-size: 13px; color: #999999;">×</div>
        </div>

        <div style="text-align: center; padding: 12px; font-size: 12px; color: #666666; border-top: 1px solid #CCCCCC;">+ Song hinzufügen</div>

      </div>
    </div>
  </div>

</div>

</body>
</html>
